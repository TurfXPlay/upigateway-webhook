<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Received</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 420px;
      margin: 60px auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .icon {
      font-size: 48px;
      color: #2e7d32;
    }
    h2 {
      margin-top: 12px;
      margin-bottom: 8px;
    }
    p {
      color: #444;
      font-size: 15px;
      line-height: 1.5;
    }
    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">✅</div>
    <h2>Payment Received</h2>

    <p>
      Your payment has been successfully received.
    </p>

    <p>
      Your slot will be confirmed shortly by the TurfX team.
    </p>

    <div class="note">
      If the amount was deducted and you do not receive confirmation,
      please contact the admin.
    </div>
  </div>

</body>
</html>
