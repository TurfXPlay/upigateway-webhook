<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TurfX Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/pay.css" />
</head>
<body>

<div class="container">
  <h2>TurfX Community Payment</h2>

  <!-- FORM -->
  <div id="formSection">
    <form id="payForm">
      <label>Name</label>
      <input id="name" />
      <div class="error" id="nameError"></div>

      <label>Mobile</label>
      <input id="mobile" />
      <div class="error" id="mobileError"></div>

      <label>Venue (optional)</label>
      <input id="venue" placeholder="e.g. Golden Leg" />

      <label>Amount (₹)</label>
      <input id="amount" type="number" step="0.01" />
      <div class="error" id="amountError"></div>

      <button type="submit">Pay Now</button>
    </form>

    <button id="clearBtn" class="secondary">Clear</button>
  </div>

  <!-- CONFIRM -->
  <div id="confirmSection" class="hidden">

    <div class="confirm-box">
      <strong>Confirm Payment</strong>
      <p>Name: <span id="cName"></span></p>
      <p>Mobile: <span id="cMobile"></span></p>
      <p>Venue: <span id="cVenue"></span></p>
      <p>Amount: ₹<span id="cAmount"></span></p>

      <p class="paise-note">
        ℹ️ To avoid UPI issues, a small paise value may be added.
      </p>
    </div>

    <div id="instructionContainer"></div>

    <div class="confirm-actions">
      <button id="proceedBtn">Proceed to Payment</button>
      <button id="cancelBtn" class="secondary">Cancel</button>
    </div>

  </div>
</div>

<script src="/pay.js"></script>
</body>
</html>
